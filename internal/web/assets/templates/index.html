{{define "content"}}
<div class="glass-panel">
    <div id="status-container" class="status-container" style="display: none">
        <h2 style="margin-bottom: 1rem; font-size: 1.2rem">
            Hashing in progress
        </h2>
        <div class="progress-container">
            <div
                id="progress-bar"
                class="progress-bar"
                style="width: 100%; animation: pulse 1s infinite"
            ></div>
        </div>
        <div id="status-text" class="status-text pulsing">
            Processing files...
        </div>
    </div>

    <div id="init-container" style="text-align: center;">
        <p style="margin-bottom: 2rem; color: var(--text-secondary);">Start a new case by selecting the evidence root directory.</p>
        <button id="browse-btn" class="btn">Browse Local Files</button>
    </div>

    <!-- File Explorer UI -->
    <div id="explorer-container" style="display: none;">
        <h2 style="margin-bottom: 1rem; font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Select Evidence Directory</h2>
        <div style="margin-bottom: 1rem; font-family: monospace; color: var(--accent-color); background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 4px;" id="current-dir"></div>
        
        <div id="folder-list" class="folder-list">
            <!-- Populated via JS -->
        </div>

        <div style="margin-top: 1.5rem; display: flex; justify-content: space-between;">
            <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
            <button id="confirm-btn" class="btn">Hash this Directory</button>
        </div>
    </div>
</div>

<script>
    let selectedPath = "";

    document.getElementById('browse-btn').addEventListener('click', () => {
        document.getElementById('init-container').style.display = 'none';
        document.getElementById('explorer-container').style.display = 'block';
        loadDirectory(""); // load default
    });

    document.getElementById('cancel-btn').addEventListener('click', () => {
        document.getElementById('explorer-container').style.display = 'none';
        document.getElementById('init-container').style.display = 'block';
    });

    function loadDirectory(path) {
        const url = path ? `/api/explore?dir=${encodeURIComponent(path)}` : `/api/explore`;
        fetch(url)
            .then(res => res.json())
            .then(data => {
                selectedPath = data.current_dir;
                document.getElementById('current-dir').innerText = data.current_dir;
                
                const list = document.getElementById('folder-list');
                list.innerHTML = "";
                data.entries.forEach(entry => {
                    const div = document.createElement('div');
                    div.className = 'folder-item';
                    div.innerHTML = `📁 ${entry.name}`;
                    div.onclick = () => loadDirectory(entry.path);
                    list.appendChild(div);
                });
            })
            .catch(err => {
                alert("Failed to read directory. " + err);
                loadDirectory(selectedPath); // revert
            });
    }

    document.getElementById('confirm-btn').addEventListener('click', () => {
        document.getElementById('explorer-container').style.display = 'none';
        document.getElementById('status-container').style.display = 'block';
        
        fetch("/api/start", { 
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ directory: selectedPath })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "started") {
                connectSSE();
            } else {
                alert("Failed to start hashing engine");
            }
        });
    });

    function connectSSE() {
        const evtSource = new EventSource("/api/progress");

        evtSource.onmessage = function (event) {
            const data = JSON.parse(event.data);
            const count = data.processed;

            document.getElementById("status-text").innerText =
                `Processed files... (${count})`;
            document.getElementById("status-text").classList.remove("pulsing");

            if (data.done) {
                evtSource.close();
                document.getElementById("status-text").innerText =
                    `Completed! Total artifacts: ${count}`;
                const pBar = document.getElementById("progress-bar");
                pBar.style.animation = "none";
                pBar.style.background = "var(--success-color)";
            }
        };

        evtSource.onerror = function (err) {
            console.error("EventSource failed:", err);
            evtSource.close();
        };
    }
</script>
{{end}}
